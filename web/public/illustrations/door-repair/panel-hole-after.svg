<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="보수 후 매끈한 방문 문짝 개념도">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f0ea"/><stop offset="1" stop-color="#e3ded4"/>
    </linearGradient>
    <linearGradient id="leaf4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe4d3"/><stop offset="0.35" stop-color="#faf2e5"/>
      <stop offset="0.8" stop-color="#e8dbc5"/><stop offset="1" stop-color="#d0bfa5"/>
    </linearGradient>
    <linearGradient id="gloss4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g4" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.03" numOctaves="4" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="sh4"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg4)"/>

  <rect x="170" y="60" width="860" height="800" rx="6" fill="url(#leaf4)"/>
  <rect x="170" y="60" width="860" height="800" rx="6" fill="#f0e5d2" filter="url(#g4)" opacity="0.8"/>
  <rect x="170" y="60" width="860" height="800" rx="6" fill="none" stroke="#bda88a" stroke-width="4"/>
  <rect x="240" y="140" width="720" height="290" rx="4" fill="none" stroke="#d0bc9e" stroke-width="7"/>
  <rect x="240" y="500" width="720" height="290" rx="4" fill="none" stroke="#d0bc9e" stroke-width="7"/>
  <rect x="252" y="152" width="696" height="266" rx="3" fill="#00000006"/>
  <rect x="252" y="512" width="696" height="266" rx="3" fill="#00000006"/>

  <!-- 보수 부위: 메꿈 후 표면 마감 (경계가 거의 사라진 상태) -->
  <ellipse cx="600" cy="620" rx="98" ry="80" fill="#f3e8d6" opacity="0.9"/>
  <ellipse cx="600" cy="620" rx="98" ry="80" fill="#efe3cf" filter="url(#g4)" opacity="0.7"/>
  <ellipse cx="600" cy="620" rx="98" ry="80" fill="none" stroke="#e2d3ba" stroke-width="1.5" opacity="0.5"/>

  <circle cx="962" cy="470" r="17" fill="#c9c9c9"/>
  <rect x="946" y="452" width="34" height="36" rx="8" fill="#dedede"/>

  <!-- 도장 광택 -->
  <path d="M190 70 L520 70 L300 850 L190 850 Z" fill="url(#gloss4)"/>

  <ellipse cx="600" cy="874" rx="380" ry="18" fill="#8b7e6b" opacity="0.22" filter="url(#sh4)"/>
</svg>
