<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="처져서 바닥에 끌리는 문 개념도">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edeae4"/><stop offset="1" stop-color="#dbd6cc"/>
    </linearGradient>
    <linearGradient id="fl5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9bda9"/><stop offset="1" stop-color="#a3947b"/>
    </linearGradient>
    <linearGradient id="lf5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6d9c3"/><stop offset="0.6" stop-color="#f0e5d2"/>
      <stop offset="1" stop-color="#cbb99c"/>
    </linearGradient>
    <filter id="g5" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.03" numOctaves="4" seed="41"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="sh5"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="scr5" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.4" numOctaves="3" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg5)"/>

  <!-- 문틀 -->
  <rect x="150" y="40" width="46" height="640" fill="#c2a37b"/>
  <rect x="150" y="40" width="46" height="640" fill="none" stroke="#9d8259" stroke-width="2.5"/>
  <rect x="150" y="40" width="820" height="44" fill="#c2a37b"/>
  <rect x="150" y="40" width="820" height="44" fill="none" stroke="#9d8259" stroke-width="2.5"/>

  <!-- 바닥 -->
  <rect y="680" width="1200" height="220" fill="url(#fl5)"/>
  <g stroke="#8f8069" stroke-width="2" opacity="0.5">
    <path d="M0 748 H1200"/><path d="M0 816 H1200"/>
    <path d="M320 680 V900"/><path d="M700 680 V900"/><path d="M1040 680 V900"/>
  </g>
  <rect y="680" width="1200" height="220" fill="url(#fl5)" filter="url(#g5)" opacity="0.5"/>

  <!-- ▼ 처진 문짝: 위 경첩 쪽은 붙고 아래 손잡이 쪽이 내려앉아 바닥에 닿는다 -->
  <path d="M196 84 L940 104 L940 720 L196 680 Z" fill="url(#lf5)"/>
  <path d="M196 84 L940 104 L940 720 L196 680 Z" fill="#e9dcc6" filter="url(#g5)" opacity="0.75"/>
  <path d="M196 84 L940 104 L940 720 L196 680 Z" fill="none" stroke="#a68f6f" stroke-width="4"/>

  <!-- 상단 틈새 벌어짐 (쐐기 모양) -->
  <path d="M196 84 L940 104 L940 128 L196 92 Z" fill="#2b2318" opacity="0.55"/>

  <!-- 경첩 (나사 풀림) -->
  <g>
    <rect x="180" y="150" width="34" height="86" rx="3" fill="#a9a9a9" stroke="#7b7b7b" stroke-width="2"/>
    <circle cx="197" cy="172" r="5" fill="#6f6f6f"/><circle cx="197" cy="214" r="5" fill="#6f6f6f"/>
    <rect x="180" y="500" width="34" height="86" rx="3" fill="#a9a9a9" stroke="#7b7b7b" stroke-width="2"/>
    <!-- 아래 경첩 기울어짐 -->
    <g transform="rotate(7 197 543)">
      <rect x="180" y="500" width="34" height="86" rx="3" fill="#9a9a9a" stroke="#6d6d6d" stroke-width="2"/>
      <circle cx="197" cy="522" r="5" fill="#5f5f5f"/><circle cx="197" cy="564" r="5" fill="#5f5f5f"/>
    </g>
    <!-- 빠져나온 나사 -->
    <circle cx="228" cy="556" r="7" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="2"/>
  </g>

  <!-- 손잡이 -->
  <circle cx="878" cy="420" r="17" fill="#9a9a9a"/>
  <rect x="862" y="402" width="34" height="36" rx="8" fill="#b6b6b6"/>

  <!-- 바닥 긁힘 자국 (호를 그리며 끌린 자국) -->
  <g filter="url(#scr5)" opacity="0.7">
    <path d="M300 706 q330 66 640 -6" fill="none" stroke="#7a6c58" stroke-width="7" stroke-linecap="round"/>
    <path d="M330 718 q310 58 596 -10" fill="none" stroke="#8d7f6a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <ellipse cx="900" cy="716" rx="90" ry="16" fill="#5f523f" opacity="0.35" filter="url(#sh5)"/>
</svg>
