<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="결을 따라 이어 붙여 복원한 벽지 개념도">
  <defs>
    <linearGradient id="tw2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/><stop offset="1" stop-color="#eae4d8"/>
    </linearGradient>
    <filter id="tt2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="3" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.085"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="sf4"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#tw2)"/>
  <rect width="1200" height="900" fill="url(#tw2)" filter="url(#tt2)" opacity="0.85"/>
  <g stroke="#e0d9cc" stroke-width="2" opacity="0.6">
    <path d="M400 0 V900"/><path d="M800 0 V900"/>
  </g>

  <!-- 새로 이어 붙인 폭 — 결을 따라 세로로 반듯하게 잘렸다 -->
  <rect x="560" y="0" width="240" height="820" fill="#faf7f1"/>
  <rect x="560" y="0" width="240" height="820" fill="#f7f3ec" filter="url(#tt2)" opacity="0.7"/>
  <path d="M560 0 V820" stroke="#e8e1d5" stroke-width="2"/>
  <path d="M800 0 V820" stroke="#e8e1d5" stroke-width="2"/>

  <!-- 가구 자국도 함께 정리된 면 -->
  <rect x="120" y="430" width="300" height="330" fill="#f5f0e6" opacity="0.85"/>

  <rect y="820" width="1200" height="80" fill="#e4ded1"/>
  <rect y="820" width="1200" height="14" fill="#d1c9b9"/>
  <ellipse cx="700" cy="836" rx="180" ry="12" fill="#77715f" opacity="0.15" filter="url(#sf4)"/>
</svg>
