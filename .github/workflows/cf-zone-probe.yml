name: Temporary Cloudflare zone probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check adbles.com zone access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          result=$(curl -fsS -G "https://api.cloudflare.com/client/v4/zones" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=adbles.com")
          if [ "$(printf '%s' "$result" | jq '.result | length')" -gt 0 ]; then
            echo "AD BLES_ZONE_ACCESS=yes"
          else
            echo "AD BLES_ZONE_ACCESS=no"
          fi
