name: Deploy to Cloudflare Pages

# CLAUDE.md 배포 규칙: "배포는 git push origin main으로만 한다."
# 로컬에서 wrangler로 직접 배포하지 않고, main 브랜치 push를 이 워크플로가 받아
# 빌드 + Cloudflare Pages 배포를 대신 수행한다.
on:
  push:
    branches: [main]
  # 콘텐츠(Supabase)만 바뀌고 코드는 그대로일 때 수동으로 다시 굽기 위한 트리거.
  # 정적 export라 DB가 바뀌어도 재빌드 전까지는 사이트에 반영되지 않는다.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # generate-sitemap.mjs와 next build 모두 이 두 값으로 Supabase를 읽는다.
      # anon 키라 RLS로 보호되지만, 값 자체는 GitHub Secrets로 관리한다.
      - name: Build (static export)
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://suriwiki.com
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name=suriwiki --branch=main
