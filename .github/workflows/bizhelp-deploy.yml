# bizhelp/ 하위(관리자 리포트 admin.suriwiki.com)만 배포한다.
# 본 사이트 deploy.yml(suriwiki 워커)과 Worker 이름이 달라 서로 덮어쓰지 않는다.
# 키워드 서브도메인 페이지는 아직 배포하지 않는다(와일드카드 방식 폐기, 개별 커스텀 도메인 방식으로 재설계 예정).
# 배포 규칙은 CLAUDE.md와 같다: main 머지로만 배포, PR에서는 빌드 검증만.
name: bizhelp-deploy
on:
  push:
    branches: [main]
    paths: ['bizhelp/**', '.github/workflows/bizhelp-deploy.yml']
  pull_request:
    paths: ['bizhelp/**', '.github/workflows/bizhelp-deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-bizhelp
  cancel-in-progress: false

defaults:
  run:
    working-directory: bizhelp

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build.mjs
      - name: Deploy admin (admin.suriwiki.com)
        if: github.event_name != 'pull_request'
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
