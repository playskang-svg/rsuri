# PR 빌드 검증.
#
# 왜 필요한가: 배포(deploy.yml)는 main push에서만 돈다. 그전까지 빌드가 깨졌는지
# 알 방법이 없어, 깨진 코드가 머지되면 그 시점부터 사이트가 갱신되지 않는다.
# 정적 export라 빌드 실패 = 배포 실패 = 사이트 정지이므로 머지 전에 잡아야 한다.
#
# 로컬·클라우드 양쪽에서 개발하는 구조라 더 중요하다 — 클라우드 세션은 네트워크
# 정책상 Supabase에 못 붙어 전체 빌드를 검증하지 못하는 경우가 있다. 그 검증을
# 여기서 대신한다.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run lint

      # deploy.yml과 같은 조건으로 굽는다. 여기서 통과하면 배포도 통과한다.
      # anon 키는 RLS로 보호되고 web/.env.example에 이미 공개된 값이라
      # PR 빌드에서 쓰여도 노출 위험이 없다.
      - name: Build (static export)
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://suriwiki.com
        run: npm run build

      # 정적 export가 실제로 페이지를 뱉었는지 확인한다. 빌드가 성공해도
      # 데이터 조회가 조용히 비면 out/에 홈 하나만 남는 사고가 가능하다.
      - name: Verify export output
        working-directory: web
        run: |
          count=$(find out -name '*.html' | wc -l)
          echo "생성된 HTML: ${count}개"
          if [ "$count" -lt 10 ]; then
            echo "::error::정적 페이지가 ${count}개뿐이다 — 데이터 조회가 비었을 가능성이 높다."
            exit 1
          fi
