# soft/ — 소프트웨어 공식 다운로드 안내 사이트(키워드 다발 1개 = 서브도메인 1개). 수리위키와 워커 이름이 달라 서로 덮어쓰지 않는다.
# main 머지로만 배포, PR 에서는 다발 검증·빌드만 한다.
# adbles.com 존은 수리위키와 다른 Cloudflare 계정/토큰에 있을 수 있다. SOFT_CLOUDFLARE_API_TOKEN·SOFT_CLOUDFLARE_ACCOUNT_ID 가 있으면 그것을 쓰고, 없으면 공용 시크릿을 쓴다.
name: soft-deploy
on:
  push:
    branches: [main]
    paths: ['soft/**', '.github/workflows/soft-deploy.yml']
  pull_request:
    paths: ['soft/**', '.github/workflows/soft-deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-soft-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: soft

jobs:
  sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build.mjs
        env:
          SEO_NAVER_VERIFY: ${{ vars.SOFT_NAVER_VERIFY }}
          SEO_GOOGLE_VERIFY: ${{ vars.SOFT_GOOGLE_VERIFY }}
      # 토큰이 배포 대상 도메인의 존을 볼 수 있는지 진단한다(값은 출력하지 않음). 실패해도 다음 단계로 간다.
      - name: Diagnose zone access
        continue-on-error: true
        run: |
          T="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"; A="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          echo "SOFT_CLOUDFLARE_API_TOKEN 등록: $([ -n "$SOFT_SET" ] && echo 예 || echo 아니오)"
          echo "SOFT_CLOUDFLARE_ACCOUNT_ID 등록: $([ -n "$SOFT_ACC_SET" ] && echo 예 || echo 아니오)"
          V="$(curl -sS -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.status // .errors[0].message')"
          echo "토큰 상태: $V"
          for F in wrangler.*.generated.jsonc; do
            H="$(jq -r '.routes[0].pattern' "$F")"; Z="${H#*.}"
            R="$(curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/zones?name=$Z")"
            N="$(echo "$R" | jq -r '.result | length')"
            SAME="$(echo "$R" | jq -r --arg a "$A" '[.result[] | select(.account.id==$a)] | length')"
            echo "$H → 존 $Z: 토큰으로 보이는 존 ${N}개, 그중 배포 계정 소속 ${SAME}개 (success=$(echo "$R" | jq -r .success))"
          done
          echo "토큰으로 보이는 존 목록(이름만): $(curl -sS -H "Authorization: Bearer $T" 'https://api.cloudflare.com/client/v4/zones?per_page=50' | jq -r '[.result[].name] | join(", ")')"
        env:
          CF_TOKEN: ${{ secrets.SOFT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.SOFT_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOFT_SET: ${{ secrets.SOFT_CLOUDFLARE_API_TOKEN != '' && '1' || '' }}
          SOFT_ACC_SET: ${{ secrets.SOFT_CLOUDFLARE_ACCOUNT_ID != '' && '1' || '' }}
      # 다른 워커에 이미 붙은 호스트를 가로채지 않는다
      - name: Check hostname conflicts
        if: github.event_name != 'pull_request'
        run: |
          T="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"; A="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          LIST="$(curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/domains")"
          [ "$(echo "$LIST" | jq -r '.success')" = "true" ] || { echo "::error::도메인 목록 조회 실패"; exit 1; }
          BAD=0
          for F in wrangler.*.generated.jsonc; do
            W="$(jq -r '.name' "$F")"; H="$(jq -r '.routes[0].pattern' "$F")"
            OWNER="$(echo "$LIST" | jq -r --arg h "$H" '.result[] | select(.hostname==$h) | .service' | head -1)"
            if [ -n "$OWNER" ] && [ "$OWNER" != "$W" ]; then echo "::error::$H 는 이미 워커 '$OWNER' 에 연결돼 있습니다"; BAD=1; fi
          done
          [ "$BAD" = "0" ] || exit 1
          echo "충돌 없음"
        env:
          CF_TOKEN: ${{ secrets.SOFT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.SOFT_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          for F in wrangler.*.generated.jsonc; do echo "▶ $F"; npx --yes wrangler@4 deploy -c "$F"; done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SOFT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SOFT_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
