# ⚠ 중앙 저장소 템플릿에서 생성됩니다. 여기서 고치지 마세요.
#
# 링크·구조 무결성 — 메뉴가 실제로 열리는지, 구조가 검색엔진에게 읽히는지,
# 거짓 링크가 남아 있는지 크롤해서 재고, 고칠 수 있는 유형을 대기열에 넣는다.
#
# 크롤(결정적)과 수정(LLM)을 분리한 이유: 링크가 왜 깨졌는지는 소스 구조를 봐야 알 수 있고,
# 정규식 치환으로 고치면 멀쩡한 링크까지 같이 망가진다.
name: agents-linkfix (수리위키)

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
    inputs:
      scan_only:
        description: "점검만 하고 고치지 않음"
        type: boolean
        default: false
      max_pages:
        description: "크롤 최대 페이지 수"
        default: "300"

permissions:
  contents: write
  issues: write

concurrency:
  group: agents-linkfix-suriwiki
  cancel-in-progress: false

jobs:
  linkfix:
    if: vars.AGENTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_KEY: suriwiki
      AGENTS_DIR: ${{ github.workspace }}/_agents
      AGENT_STATE_DIR: ${{ github.workspace }}/.fleet/state
      GH_TOKEN: ${{ github.token }}
      SCAN_ONLY: ${{ inputs.scan_only || 'false' }}
      SITE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # _agents 는 중앙 저장소 체크아웃이다. 커밋 대상이 아니다 —
      # .gitignore 가 아니라 .git/info/exclude 에 넣어 사이트 저장소를 더럽히지 않는다.
      - name: 체크아웃 경로 제외
        run: echo "_agents/" >> .git/info/exclude

      - name: 에이전트 원본 가져오기
        uses: actions/checkout@v4
        with:
          repository: playskang-svg/adbles-agents
          path: _agents
          ssh-key: ${{ secrets.AGENTS_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 이전 상태 복원
        run: node "$AGENTS_DIR/runner/state.mjs" restore --site "$SITE_KEY"

      # 종료코드 2 = 치명 결함(메뉴가 안 열리거나 페이지가 비어 있다).
      # 여기서 워크플로를 죽이지 않는다 — 고치는 단계까지 가야 의미가 있다.
      - name: linkfix — 크롤 및 점검
        id: scan
        continue-on-error: true
        run: node "$AGENTS_DIR/agents/linkfix/scripts/linkfix.mjs" scan --site "$SITE_KEY" --max "${{ inputs.max_pages || '300' }}"

      - name: 자동 수정 대상 추리기
        id: triage
        run: node "$AGENTS_DIR/runner/linkfix-triage.mjs" --site "$SITE_KEY" --out "$RUNNER_TEMP/fixes.md"

      # 고치는 것은 맥 로컬 claude 나 Codespace 의 Copilot 이 한다 — API 키 없이 요금제로.
      # 여기서는 고칠 목록을 대기열에 넣는다. 깨진 링크는 재고로 미루지 않고 다음 집필 회차에 바로 고친다.
      - name: 수정 대기열
        if: steps.triage.outputs.fixable > 0 && env.SCAN_ONLY != 'true'
        run: |
          node "$AGENTS_DIR/runner/queue.mjs" put --site "$SITE_KEY" --type linkfix --fixes "$RUNNER_TEMP/fixes.md" --count "${{ steps.triage.outputs.fixable }}"
          if [ -n "$(git status --porcelain .fleet/queue)" ]; then
            git config user.name "adbles-agents[bot]"
            git config user.email "adbles-agents@users.noreply.github.com"
            git add .fleet/queue
            git commit -m "chore(queue): 수리위키 링크 수정 대기열 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || echo "::warning::대기열 푸시 실패"
          fi

      - name: 상태 저장
        if: always()
        run: node "$AGENTS_DIR/runner/state.mjs" save --site "$SITE_KEY" --commit

      - name: sitemgr — 관리 에이전트 보고
        if: always()
        run: node "$AGENTS_DIR/agents/sitemgr/scripts/sitemgr.mjs" report --site "$SITE_KEY" --issue
